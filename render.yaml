# Конфигурация для деплоя на Render (https://render.com).
# После пуша репозитория в GitHub: New → Blueprint → выбрать этот репозиторий.
services:
  - type: web
    name: air-alert-map
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
